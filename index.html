<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Game</title>
    <link rel="stylesheet" href="scrabble.css">
</head>
<body>
    <div id="setup-overlay">
        <div class="setup-card">
            <h1>Scrabble</h1>
            <p>Select number of players:</p>
            <div class="player-buttons">
                <button onclick="startGame(1)">1 Player</button>
                <button onclick="startGame(2)">2 Players</button>
                <button onclick="startGame(3)">3 Players</button>
                <button onclick="startGame(4)">4 Players</button>
            </div>
        </div>
    </div>

    <div id="game-container" style="display: none;">
        
        <div id="game-stage">
            <div id="board-container">
                <div id="player-turn-indicator">Waiting...</div>
                <div class="board-and-actions">
                    <div id="scrabble-board"></div>

                    <div class="side-actions">
                        <div class="main-actions">
                            <button id="submit-word">Submit Word</button>
                            <button id="exchange-tiles">Exchange Tiles</button>
                            <button id="pass-turn">Pass</button>
                            <button id="reset-board">Reset</button>
                        </div>

                        <div class="scores-row">
                            <button id="scores">Scores</button>
                        </div>

                        <div class="tile-bag-panel" aria-label="Tiles remaining in bag">
                            <div class="tile-bag-header">
                                <span class="tile-bag-title">Bag</span>
                                <span class="tile-bag-total-wrap"><span id="tile-bag-total">0</span> left</span>
                            </div>
                            <div id="tile-bag-display" class="tile-bag-grid"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="player-area-1" class="player-side pos-left"></div>
            <div id="player-area-2" class="player-side pos-right"></div>
            <div id="player-area-3" class="player-side pos-top"></div>
            <div id="player-area-4" class="player-side pos-bottom"></div>
        </div>

        <div id="scores-modal" class="scores-modal" style="display: none;">
            <div class="scores-modal-card">
                <div class="scores-modal-header">
                    <h3>Scores</h3>
                    <button id="close-scores" class="scores-close" type="button">Close</button>
                </div>

                <table class="scores-table">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="scores-tbody"></tbody>
                </table>

                <div class="scores-modal-history">
                    <h4>History</h4>
                    <div id="history-tables"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="scrabble.js"></script>
</body>

</html>
